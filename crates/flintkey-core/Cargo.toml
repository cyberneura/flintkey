[package]
name = "flintkey-core"
description = "Engine-independent core of the Flintkey launcher: configuration, actions, secrets and search."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
nucleo-matcher = "0.3.1"
open = "5.4.5"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "=2.1.1"
serde_json = "1"
thiserror = "2"
yaml-edit = "0.3.6"

[dev-dependencies]
tempfile = "3"
