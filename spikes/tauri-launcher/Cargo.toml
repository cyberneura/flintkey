[package]
name = "spike-tauri-launcher"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spike-common = { path = "../common" }

[features]
# Without the Tauri CLI nothing enables this, and the app goes looking for a dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
