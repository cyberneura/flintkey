# cargo-about configuration, read by scripts/generate-third-party-notices.sh.
# Only crates that ship in the distributed builds are covered: build and test dependencies, and crates
# that only land in targets we do not distribute (Linux), are left out.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

# Flintkey's own crates (publish = false) are not third-party.
[private]
ignore = true

# cargo-about takes a source file that starts with a license notice for the license text and embeds the
# whole file. These name the files to use instead. The checksum is the file's sha256; if an upgrade
# changes the file, cargo-about warns and ignores the entry (take it again from the new version).
[encoding_rs.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[encoding_rs.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "3fa4ca83dcc9237839b1bdeb2e6d16bdfb5ec0c5ce42b24694d8bbf0dcbef72c"

[[encoding_rs.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

[[encoding_rs.clarify.files]]
path = "LICENSE-WHATWG"
license = "BSD-3-Clause"
checksum = "838118388fe5c2e7f1dbbaeed13e1c7f3ebf88be91319c7c1d77c18e987d1a50"

[schemars_derive.clarify]
license = "MIT"

[[schemars_derive.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "1954992a2b32e8a2af24a4c11b726902e344c1934b947a77f04d404908f8db30"
