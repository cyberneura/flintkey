[package]
name = "flintkey-desktop"
description = "Flintkey desktop application: tray icon, global hotkey and the launcher window."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
flintkey-core = { path = "../../../crates/flintkey-core" }
open = "5.4.5"
serde = { version = "1", features = ["derive"] }
# macos-private-api: 角丸のパネルを出すための透明な窓に必要。
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"
