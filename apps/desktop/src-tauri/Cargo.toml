[package]
name = "flintkey-desktop"
description = "Flintkey desktop application: tray icon, global hotkey and the launcher window."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
flintkey-core = { path = "../../../crates/flintkey-core" }
notify = "=8.2.2"
open = "5.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: needed for the transparent window behind the rounded panel.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString"] }

[dev-dependencies]
tempfile = "3"
