<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS template image: only alpha matters. The menu bar draws it 18pt tall, so both shapes use the full height.
       The stone is half-transparent behind; the star is solid in front, separated from the stone by a transparent
       gap. -->
  <defs>
    <mask id="gap">
      <rect width="1024" height="1024" fill="white"/>
      <path d="M512 0 L602 422 L1024 512 L602 602 L512 1024 L422 602 L0 512 L422 422 Z" fill="black" stroke="black" stroke-width="110" stroke-linejoin="round"/>
    </mask>
  </defs>
  <polygon points="40,620 150,200 470,40 840,140 1004,500 830,930 290,990" fill="black" fill-opacity="0.45" mask="url(#gap)"/>
  <path d="M512 0 L602 422 L1024 512 L602 602 L512 1024 L422 602 L0 512 L422 422 Z" fill="black" stroke="black" stroke-width="10" stroke-linejoin="round"/>
</svg>
